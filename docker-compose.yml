version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sxsinfo_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - sxs_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: sxsinfo_db
    restart: always
    environment:
      MYSQL_DATABASE: sxsinfo
      MYSQL_USER: hanhan
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./sxsinfo:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --max_connections=500
    networks:
      - sxs_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: sxsinfo_backend:latest
    container_name: sxsinfo_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    environment:
      DJANGO_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DB_NAME: sxsinfo
      DB_USER: hanhan
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/1
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PASSWORD_ENCRYPT_KEY: ${PASSWORD_ENCRYPT_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SERVICE_URL: ${DEEPSEEK_SERVICE_URL:-https://api.deepseek.com/v1/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./backend/media:/app/media
      - ./backend/logs:/app/logs
      - static_volume:/app/staticfiles
    entrypoint: [ "/app/entrypoint.sh" ]
    networks:
      - sxs_network

  cron:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: sxsinfo_backend:latest
    container_name: sxsinfo_cron
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DB_NAME: sxsinfo
      DB_USER: hanhan
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 3306
      ENABLE_CRON: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      PASSWORD_ENCRYPT_KEY: ${PASSWORD_ENCRYPT_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SERVICE_URL: ${DEEPSEEK_SERVICE_URL:-https://api.deepseek.com/v1/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./backend/logs:/app/logs
    entrypoint: [ "/app/entrypoint.sh" ]
    networks:
      - sxs_network

  pc:
    build:
      context: ./pc
      dockerfile: Dockerfile
      args:
        VITE_PASSWORD_ENCRYPT_KEY: ${VITE_PASSWORD_ENCRYPT_KEY:-}
    image: sxsinfo_pc:latest
    container_name: sxsinfo_pc
    volumes:
      - pc_dist:/app/dist
    networks:
      - sxs_network

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        VITE_PASSWORD_ENCRYPT_KEY: ${VITE_PASSWORD_ENCRYPT_KEY:-}
    image: sxsinfo_mobile:latest
    container_name: sxsinfo_mobile
    volumes:
      - mobile_dist:/app/dist
    networks:
      - sxs_network

  nginx:
    image: nginx:stable-alpine
    container_name: sxsinfo_nginx
    restart: always
    ports:
      - "${SERVER_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      pc:
        condition: service_started
      mobile:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/50x.html:/usr/share/nginx/html/50x.html:ro
      - pc_dist:/usr/share/nginx/html/pc:ro
      - mobile_dist:/usr/share/nginx/html/mobile:ro
      - static_volume:/usr/share/nginx/html/static_django:ro
      - ./backend/media:/usr/share/nginx/html/media:ro
    networks:
      - sxs_network

networks:
  sxs_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  static_volume:
  pc_dist:
  mobile_dist:
