version: '3.8'

services:
  # ============================================
  # Redis 缓存服务
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: lims_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - lims_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============================================
  # MySQL 数据库服务
  # ============================================
  db:
    image: mysql:8.0
    container_name: lims_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lims}
      MYSQL_USER: ${DB_USER:-lims}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-v2/sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --max_connections=500 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - lims_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ============================================
  # Django 后端服务
  # ============================================
  backend:
    build:
      context: ./backend-v2
      dockerfile: Dockerfile
    image: lims_backend:latest
    container_name: lims_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/common/health/')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    environment:
      DJANGO_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DB_NAME: ${DB_NAME:-lims}
      DB_USER: ${DB_USER:-lims}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/1
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PASSWORD_ENCRYPT_KEY: ${PASSWORD_ENCRYPT_KEY:?PASSWORD_ENCRYPT_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SERVICE_URL: ${DEEPSEEK_SERVICE_URL:-https://api.deepseek.com/v1/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./backend-v2/media:/app/media
      - ./backend-v2/logs:/app/logs
      - static_volume:/app/staticfiles
    entrypoint: ["/app/entrypoint.sh"]
    networks:
      - lims_network

  # ============================================
  # PC 端前端构建
  # ============================================
  frontend-pc:
    build:
      context: ./frontend
      dockerfile: Dockerfile.pc
      args:
        VITE_PASSWORD_ENCRYPT_KEY: ${VITE_PASSWORD_ENCRYPT_KEY:-}
        VITE_API_V2_BASE_URL: ${VITE_API_V2_BASE_URL:-/api/v1}
    image: lims_frontend_pc:latest
    container_name: lims_frontend_pc
    volumes:
      - pc_dist:/app/dist
    networks:
      - lims_network

  # ============================================
  # 移动端前端构建
  # ============================================
  frontend-mobile:
    build:
      context: ./frontend
      dockerfile: Dockerfile.mobile
      args:
        VITE_PASSWORD_ENCRYPT_KEY: ${VITE_PASSWORD_ENCRYPT_KEY:-}
        VITE_API_V2_BASE_URL: ${VITE_API_V2_BASE_URL:-/api/v1}
    image: lims_frontend_mobile:latest
    container_name: lims_frontend_mobile
    volumes:
      - mobile_dist:/app/dist
    networks:
      - lims_network

  # ============================================
  # Nginx 反向代理 + 静态文件服务
  # ============================================
  nginx:
    image: nginx:stable-alpine
    container_name: lims_nginx
    restart: always
    ports:
      - "${SERVER_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend-pc:
        condition: service_started
      frontend-mobile:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - pc_dist:/usr/share/nginx/html/pc:ro
      - mobile_dist:/usr/share/nginx/html/mobile:ro
      - static_volume:/usr/share/nginx/html/static_django:ro
      - ./backend-v2/media:/usr/share/nginx/html/media:ro
      - ./ssl/certs:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - lims_network

networks:
  lims_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  static_volume:
  pc_dist:
  mobile_dist: