<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <!-- 图标放在 public/ 下，构建时拷到 dist 根目录。
       必须是相对路径：Tauri 的内置资源协议在取不到资源时返回 500（不是 404），
       少一个文件就会在控制台刷一片 "Failed to load resource: 500"。 -->
  <link rel="icon" href="./favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧实训室平台</title>
  <style>
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #f0f2f5 0%, #e6f7ff 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loading-logo {
      font-size: 28px;
      font-weight: 600;
      color: #1890ff;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #1890ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      color: #666;
      font-size: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <!--
    启动占位放在 #app 之外（桌面端专用改动）：
    Vue 的 mount() 会清空容器内容，放在里面就会"啪"地消失 → 白闪；
    放在外面则由 main.js 在挂载完成后淡出（200ms），启动过程没有白屏。
  -->
  <div id="app-loading">
    <div class="loading-logo">智慧实训室平台V2</div>
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载，请稍候...</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
