<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1989fa">
  <title>智慧实训室平台 - 移动端</title>
  <style>
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #f0f2f5 0%, #e6f7ff 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loading-logo {
      font-size: 24px;
      font-weight: 600;
      color: #1989fa;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #1989fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      color: #666;
      font-size: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="app-loading">
      <div class="loading-logo">智慧实训室平台V2</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">正在加载，请稍候...</div>
    </div>
  </div>
  <script type="module" src="/src/main.mobile.js"></script>
</body>

</html>
