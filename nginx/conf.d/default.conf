server {
    listen 80;
    listen [::]:80;
    server_name _;

    charset utf-8;

    # ============================================
    # 根路径 - 根据设备类型自动跳转
    # ============================================
    location = / {
        set $mobile_rewrite do_not_perform;

        if ($http_user_agent ~* "(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge |maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino") {
            set $mobile_rewrite perform;
        }

        if ($mobile_rewrite = perform) {
            return 301 /m/;
        }

        root   /usr/share/nginx/html/pc;
        index  index.pc.html;
    }

    # ============================================
    # 移动端入口
    # ============================================
    location /m/ {
        alias  /usr/share/nginx/html/mobile/;
        index  index.mobile.html;
        try_files $uri $uri/ /m/index.mobile.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /m/favicon.ico {
        alias  /usr/share/nginx/html/mobile/favicon.ico;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ============================================
    # API 反向代理到 Django 后端
    # ============================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /static/ {
        alias /usr/share/nginx/html/static_django/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # PC 端静态资源
    # ============================================
    location /assets/ {
        root   /usr/share/nginx/html/pc;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # 移动端静态资源
    # ============================================
    location /m/assets/ {
        alias  /usr/share/nginx/html/mobile/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root   /usr/share/nginx/html/pc;
        index  index.pc.html;
        try_files $uri $uri/ /index.pc.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
